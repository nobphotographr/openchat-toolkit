<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#21654F"><title>OpenChat Toolkit</title><link rel="icon" href="/app-icon.ico" sizes="any"><link rel="icon" href="/app-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<aside class="sidebar">
 <div class="brand"><img class="brandmark" src="/app-icon.svg" width="36" height="36" alt=""><div>OpenChat Toolkit<small>YOUR COMMUNICATION SPACE</small></div></div>
 <button class="primary new-post" data-page="compose">＋ 投稿を作成</button>
 <div class="nav-caption">ワークスペース</div>
 <nav>
  <button data-page="home"><span>⌂</span>ホーム</button>
  <button data-page="operations"><span>◎</span>運用状況</button>
  <button data-page="schedule"><span>▦</span>予約・実行履歴</button>
  <button data-page="recurrences"><span>↻</span>繰り返し予約</button>
  <button data-page="templates"><span>▧</span>テンプレート</button>
  <button data-page="drafts"><span>▤</span>下書き</button>
 </nav>
 <div class="nav-caption">ライブラリ</div>
 <nav>
  <button data-page="history"><span>⌕</span>トーク履歴</button>
  <button data-page="unread"><span>◇</span>キーワード受信箱</button>
  <button data-page="bookmarks"><span>☆</span>保存した投稿</button>
  <button data-page="links"><span>↗</span>リンク</button>
 </nav>
 <div class="sidebar-bottom"><nav><button data-page="settings"><span>⚙</span>アプリ設定</button><button data-page="rules"><span>⚙</span>キーワード設定</button><button data-page="status"><span>◷</span>取得状況</button></nav><div class="local-status"><i></i> このPCのワークスペース<small>投稿可能な時間　8:00 — 21:00</small></div></div>
</aside>
<main><header><div><div class="eyebrow">WORKSPACE <span>/</span> <span id="breadcrumb">ホーム</span></div><h1 id="title">ホーム</h1><p id="subtitle"></p></div><button id="refresh" class="icon-button" title="表示を更新">↻</button></header><div id="content"></div></main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<dialog id="ask-dialog"><h2>操作の確認</h2><p id="ask-text"></p><div class="row"><button id="ask-yes" class="primary">実行する</button><button id="ask-no">戻る</button></div></dialog>
</body></html>
